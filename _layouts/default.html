<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary Meta Tags -->
  <title>{{ page.title | default: site.title }}</title>
  <meta name="title" content="{{ page.title | default: site.title }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="robots" content="index, follow">

  <!-- Keywords for search -->
  <meta name="keywords" content="Teofil Mititelu, Java Developer, Spring Boot, Microservices, Kafka, Kubernetes, Docker, AI-Assisted Engineering, Agentic AI, Backend Developer, Romania, Iași, Resume, CV, Software Engineer">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="{{ site.title }} Resume">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <!-- Structured Data (JSON-LD) for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Teofil Mititelu",
    "jobTitle": "{{ page.job_title | default: "Java Developer" }}",
    "description": "{{ page.description | default: site.description }}",
    "url": "{{ page.url | absolute_url }}",
    "email": "teofil.mititelu@gmail.com",
    "telephone": "+40787438469",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Iași",
      "addressCountry": "Romania"
    },
    "sameAs": [
      "https://github.com/mititeluteofil",
      "https://www.linkedin.com/in/teofıl-mititelu-60a156139"
    ],
    "knowsAbout": [
      "Java",
      "Spring Boot",
      "Microservices",
      "Apache Kafka",
      "Kubernetes",
      "Docker",
      "PostgreSQL",
      "REST API",
      "CI/CD",
      "Cloud Computing",
      "Agentic AI",
      "AI-Assisted Development"
    ],
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Alexandru Ioan Cuza University",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Iași",
        "addressCountry": "Romania"
      }
    },
    "worksFor": {
      "@type": "Organization",
      "name": "Yonder"
    }
  }
  </script>

  <!-- Additional Structured Data for WebPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "{{ page.title | default: site.title }}",
    "description": "{{ page.description | default: site.description }}",
    "url": "{{ page.url | absolute_url }}",
    "inLanguage": "en",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Teofil Mititelu Resume",
      "url": "{{ site.url }}{{ site.baseurl }}/"
    },
    "about": {
      "@type": "Person",
      "name": "Teofil Mititelu"
    },
    "mainEntity": {
      "@type": "Person",
      "name": "Teofil Mititelu"
    }
  }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- LinkedIn Badge -->
  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
</head>
<body>
  <div class="wrapper">
    <div class="print-actions no-print">
      <button onclick="window.print()" class="print-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Export to PDF
      </button>
      <span class="print-hint">Use "Save as PDF" in print dialog</span>
    </div>
    {{ content }}
  </div>
</body>
</html>
